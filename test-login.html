<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        input, button {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            font-size: 16px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
            white-space: pre-wrap;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>Test Login Sistema Calcio</h1>
    
    <div>
        <input type="email" id="email" placeholder="Email" value="admin@juventusacademymilano.it">
        <input type="password" id="password" placeholder="Password" value="password123">
        <button onclick="testLogin()">Test Login</button>
        <button onclick="checkData()">Verifica Dati Salvati</button>
        <button onclick="testAthletes()">Test API Atleti</button>
        <button onclick="clearData()">Pulisci LocalStorage</button>
    </div>
    
    <div id="result"></div>

    <script>
        const API_URL = 'http://localhost:3000/api/v1';
        
        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            try {
                resultDiv.innerHTML = 'Tentativo login...';
                
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Salva i dati nel localStorage
                    const { token, user, organizationId } = data.data;
                    
                    localStorage.setItem('token', token);
                    localStorage.setItem('user', JSON.stringify(user));
                    
                    // Salva organizationId
                    const orgId = organizationId || user.organizationId;
                    if (orgId) {
                        localStorage.setItem('organizationId', orgId);
                    }
                    
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `✅ LOGIN RIUSCITO!\n\nToken: ${token.substring(0, 50)}...\n\nOrganization ID: ${orgId || 'NON TROVATO'}\n\nUser: ${JSON.stringify(user, null, 2)}`;
                } else {
                    resultDiv.className = 'error';
                    resultDiv.innerHTML = `❌ LOGIN FALLITO!\n\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = `❌ ERRORE:\n\n${error.message}`;
            }
        }
        
        function checkData() {
            const resultDiv = document.getElementById('result');
            const token = localStorage.getItem('token');
            const organizationId = localStorage.getItem('organizationId');
            const user = localStorage.getItem('user');
            
            resultDiv.className = '';
            resultDiv.innerHTML = `📊 DATI NEL LOCALSTORAGE:\n\nToken: ${token ? token.substring(0, 50) + '...' : 'MANCANTE'}\n\nOrganization ID: ${organizationId || 'MANCANTE'}\n\nUser: ${user || 'MANCANTE'}`;
        }
        
        async function testAthletes() {
            const resultDiv = document.getElementById('result');
            const token = localStorage.getItem('token');
            const organizationId = localStorage.getItem('organizationId');
            
            if (!token) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = '❌ Devi prima fare login!';
                return;
            }
            
            try {
                resultDiv.innerHTML = 'Recupero atleti...';
                
                const headers = {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                };
                
                if (organizationId) {
                    headers['X-Organization-ID'] = organizationId;
                }
                
                const response = await fetch(`${API_URL}/athletes`, {
                    method: 'GET',
                    headers: headers
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const athletes = data.data.athletes || data.data || [];
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `✅ ATLETI RECUPERATI!\n\nTotale: ${athletes.length}\n\n${JSON.stringify(athletes.slice(0, 3), null, 2)}`;
                } else {
                    resultDiv.className = 'error';
                    resultDiv.innerHTML = `❌ ERRORE API:\n\n${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = `❌ ERRORE:\n\n${error.message}`;
            }
        }
        
        function clearData() {
            localStorage.clear();
            document.getElementById('result').innerHTML = '🧹 LocalStorage pulito!';
        }
        
        // Controlla subito i dati salvati
        window.onload = checkData;
    </script>
</body>
</html>
